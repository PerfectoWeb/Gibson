name: Bug report
description: Something renders wrong, crashes or shows the wrong numbers
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options: [Apple silicon, Intel]
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: Display setup
      description: Resolution, scaling, and how many screens
      placeholder: "2x 27 inch 5K, plus a vertical 1440p"

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include a screenshot if the problem is visual
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make install
        2. Open System Settings, Screen Saver
        3. ...
